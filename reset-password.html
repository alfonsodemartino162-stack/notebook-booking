<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    .card { max-width: 520px; margin: 0 auto; border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
    h1 { margin: 0 0 10px 0; }
    p { color:#666; margin-top: 0; }
    label { display:block; font-size: 12px; color:#555; margin-top:12px; }
    input { width: 100%; padding: 10px; border:1px solid #ccc; border-radius: 10px; }
    .row { display:flex; gap:10px; align-items:center; }
    .muted { color:#666; }
    .ok { color:#0a7a1f; }
    .err { color:#b00020; }
    button { padding: 10px 14px; border-radius: 10px; border:1px solid #999; background:#111; color:#fff; cursor:pointer; }
    .footer { margin-top: 14px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reimposta password</h1>
    <p class="muted">Inserisci una nuova password. Il token viene letto automaticamente dal link.</p>

    <label>Token</label>
    <input id="token" readonly />

    <label>Nuova password</label>
    <div class="row">
      <input id="pw1" type="password" placeholder="min 6 caratteri" />
      <button id="toggle1" type="button" title="mostra/nascondi">👁️</button>
    </div>

    <label>Conferma password</label>
    <div class="row">
      <input id="pw2" type="password" placeholder="ripeti password" />
      <button id="toggle2" type="button" title="mostra/nascondi">👁️</button>
    </div>

    <div class="footer muted">La password deve avere almeno 6 caratteri.</div>

    <div style="margin-top:14px">
      <button id="submitBtn" type="button">Imposta nuova password</button>
      <span id="msg" class="muted"></span>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const qs = new URLSearchParams(location.search);
    $('token').value = qs.get('token') || '';

    const toggle = (inp, btn) => btn.addEventListener('click', () => {
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });
    toggle($('pw1'), $('toggle1'));
    toggle($('pw2'), $('toggle2'));

    function setMsg(text, ok=false){
      const el = $('msg');
      el.textContent = text || '';
      el.className = ok ? 'ok' : (text ? 'err' : 'muted');
    }

    async function resetPassword(){
      setMsg('');
      const token = $('token').value.trim();
      const pw1 = $('pw1').value;
      const pw2 = $('pw2').value;

      if (!token) return setMsg('Token mancante.');
      if (!pw1 || pw1.length < 6) return setMsg('La password deve avere almeno 6 caratteri.');
      if (pw1 !== pw2) return setMsg('Le password non coincidono.');

      try {
        const res = await fetch('/api/password/reset', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ token, newPassword: pw1 })
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        setMsg('Password aggiornata! Ora puoi effettuare il login.', true);
        $('pw1').value = ''; $('pw2').value = '';
      } catch (e) {
        setMsg(e.message || 'Errore nel reset password');
      }
    }

    $('submitBtn').addEventListener('click', resetPassword);

    // invio con Enter dentro i campi password
    ['pw1','pw2'].forEach(id => {
      $(id).addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') resetPassword();
      });
    });
  </script>
</body>
</html>
