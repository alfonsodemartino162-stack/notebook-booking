<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook / Carrelli - Prenotazioni</title>
  <link rel="icon" href="data:," />
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: #f6f6f6;
    }
    header {
      background: #0a84ff;
      color: white;
      padding: 12px 16px;
      font-size: 18px;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #0001;
    }
    h2 {
      margin-top: 0;
    }
    input, select, button {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #0a84ff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: #eee;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #fafafa;
    }
    .muted {
      color: #666;
      font-size: 14px;
    }
    .center {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>📘 Prenotazione Notebook / Carrelli</header>

  <main>
    <section id="login">
      <h2>Accesso docente</h2>
      <p class="muted">Inserisci il tuo codice personale per accedere.</p>
      <input id="teacherCode" placeholder="Codice docente" />
      <button id="btnLoginCode">Accedi</button>
    </section>

    <section id="dashboard" style="display:none;">
      <h2>Prenotazioni</h2>
      <p class="muted" id="welcome"></p>
      <button id="btnLogout" class="secondary">Esci</button>

      <h3>Le tue prenotazioni</h3>
      <table id="tblBookings">
        <thead>
          <tr>
            <th>Data</th><th>Notebook</th><th>Ora/Periodo</th><th>Classe</th><th>Aula</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Nuova prenotazione</h3>
      <div>
        <label>Data <input type="date" id="date"></label><br><br>
        <label>Periodo 
          <select id="period"></select>
        </label><br><br>
        <label>Notebook 
          <select id="notebook"></select>
        </label><br><br>
        <label>Classe <input id="class" placeholder="es. 3A"></label><br><br>
        <label>Aula <input id="room" placeholder="es. Lab1"></label><br><br>
        <button id="btnBook">Prenota</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
